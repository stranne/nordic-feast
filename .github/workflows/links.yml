name: Source links

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Cited sources and image credits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A failure can be a moved source or a site that is temporarily unavailable. Inspect it before changing a citation.
      - name: Check cited links
        run: python3 scripts/check_links.py
