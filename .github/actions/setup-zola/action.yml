name: Set up Zola
description: Install the pinned Zola release after verifying its checksum.
runs:
  using: composite
  steps:
    - name: Install Zola
      shell: bash
      env:
        ZOLA_VERSION: 0.23.6
        ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4
      run: |
        archive="$RUNNER_TEMP/zola.tar.gz"
        curl --fail --silent --show-error --location --output "$archive" \
          "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        echo "${ZOLA_SHA256}  ${archive}" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/zola"
        tar -xzf "$archive" -C "$RUNNER_TEMP/zola" zola
        echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
