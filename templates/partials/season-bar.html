{% set bar_months = load_data(path='data/months.json') %}
<div id="{{ bar_id }}" class="season-bar{% if bar_labelled %} season-bar--labelled{% endif %}" role="img" aria-label="Säsong i {{ config.extra.country_name }}. {% for month in bar_months %}{{ month.name }}: {% if month.number in bar_season.listed_months %}i säsong{% else %}ur säsong{% endif %}. {% endfor %}">
  {% for month in bar_months %}
    {% if month.number % 3 == 1 %}<span class="season-quarter" aria-hidden="true">{% endif %}
      <span class="season-month" data-season-month="{{ month.number }}">
        <span class="season-fill {% if month.number in bar_season.listed_months %}season-fill--listed{% else %}season-fill--out{% endif %}"></span>
        {% if bar_labelled %}<span class="season-label">{{ month.short }}</span>{% endif %}
      </span>
    {% if month.number % 3 == 0 %}</span>{% endif %}
  {% endfor %}
</div>
