<!doctype html>
<!-- Source for static/social-card.png (1200×630). Render with: npm run social-card -->
<html lang="sv">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: "Lora"; font-weight: 400; src: url("../static/fonts/lora-latin-400.woff2") format("woff2"); }
    @font-face { font-family: "Source Sans 3"; font-weight: 400 700; src: url("../static/fonts/source-sans-3-latin-variable.woff2") format("woff2"); }
    :root { --paper: #f6f4ee; --ink: #293c31; --muted: #62695f; --line: #d6d9cc; --wash: #eaece2; --accent: #36523e; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Source Sans 3", sans-serif; }
    .card { display: grid; grid-template-columns: 1fr 400px; gap: 56px; align-items: center; height: 100%; padding: 0 80px; border-bottom: 14px solid var(--accent); }
    .eyebrow { margin: 0 0 12px; color: var(--muted); font-size: 28px; }
    h1 { margin: 0; font-family: "Lora", serif; font-weight: 400; font-size: 112px; line-height: 1; letter-spacing: -.025em; }
    h1 span { color: #897446; }
    .lede { margin: 28px 0 0; max-width: 20em; font-size: 34px; line-height: 1.3; text-wrap: balance; }
    .art { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 20px; }
    .art img { width: 120px; height: 120px; object-fit: contain; }
  </style>
</head>
<body>
  <main class="card">
    <div>
      <p class="eyebrow">Säsongskalender för Sverige</p>
      <h1>Nordic Feast<span>.</span></h1>
      <p class="lede">Svenska grönsaker, frukter och bär i säsong, månad för månad.</p>
    </div>
    <div class="art" aria-hidden="true">
      <img src="../static/images/crops/jordgubbar.svg" alt="">
      <img src="../static/images/crops/morot.svg" alt="">
      <img src="../static/images/crops/apple.svg" alt="">
      <img src="../static/images/crops/pumpa.svg" alt="">
      <img src="../static/images/crops/blabar.svg" alt="">
      <img src="../static/images/crops/broccoli.svg" alt="">
    </div>
  </main>
</body>
</html>
