# `zola serve` replaces base_url with the local preview address.
base_url = "https://nordicfeast.stranne.se"
title = "Nordic Feast"
description = "Se vilka svenska grönsaker, frukter och bär som är i säsong, månad för månad, med källa för varje råvara."
default_language = "sv"
compile_sass = false
build_search_index = false
generate_feeds = false
